name: AI Container Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Pull Docker image
        run: |
          docker pull nginx:latest

      - name: Scan image with Trivy
        run: |
          trivy image --format json -o scan.json nginx:latest

      - name: Summarize Trivy scan (counts + fixable)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' scan.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' scan.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' scan.json)
          FIXABLE=$(jq '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")] | length' scan.json)

          export TOTAL CRITICAL HIGH FIXABLE

          if [ "${TOTAL:-0}" -gt 0 ]; then
            FIXABLE_RATIO=$(python3 -c "print(round(int('${FIXABLE:-0}')/int('${TOTAL:-1}'), 3) if int('${TOTAL:-0}') > 0 else 0)")
            HIGH_RISK_RATIO=$(python3 -c "total=int('${TOTAL:-1}'); crit=int('${CRITICAL:-0}'); high=int('${HIGH:-0}'); print(round((crit+high)/total, 3) if total > 0 else 0)")
          else
            FIXABLE_RATIO=0
            HIGH_RISK_RATIO=0
          fi

          echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"
          echo "CRITICAL=$CRITICAL" >> "$GITHUB_ENV"
          echo "HIGH=$HIGH" >> "$GITHUB_ENV"
          echo "FIXABLE=$FIXABLE" >> "$GITHUB_ENV"
          echo "FIXABLE_RATIO=$FIXABLE_RATIO" >> "$GITHUB_ENV"
          echo "HIGH_RISK_RATIO=$HIGH_RISK_RATIO" >> "$GITHUB_ENV"

          echo "=== Scan Summary ==="
          echo "TOTAL=$TOTAL"
          echo "CRITICAL=$CRITICAL"
          echo "HIGH=$HIGH"
          echo "FIXABLE=$FIXABLE"
          echo "FIXABLE_RATIO=$FIXABLE_RATIO"
          echo "HIGH_RISK_RATIO=$HIGH_RISK_RATIO"

      - name: Run AI risk prediction
        run: |
          python src/predict_risk.py scan.json | tee result.txt

          - name: Enforce security policy (AI + fixability + severity)
          run: |
            set -euo pipefail
  
            echo "=== Policy Inputs ==="
            cat result.txt
            echo ""
            echo "TOTAL=$TOTAL CRITICAL=$CRITICAL HIGH=$HIGH FIXABLE=$FIXABLE FIXABLE_RATIO=$FIXABLE_RATIO HIGH_RISK_RATIO=$HIGH_RISK_RATIO"
  
            AI_HIGH=0
            if grep -q "Predicted Risk Level: HIGH" result.txt; then
              AI_HIGH=1
            fi
  
            # 1) Any CRITICAL + at least one fixable vuln => FAIL
            if [ "${CRITICAL:-0}" -ge 1 ] && [ "${FIXABLE:-0}" -ge 1 ]; then
              echo "❌ BLOCK: CRITICAL vulnerabilities exist and at least one is fixable."
              exit 1
            fi
  
            # 2) AI predicts HIGH and fixable_ratio >= 0.20 OR high_risk_ratio >= 0.30 => FAIL
            if [ "$AI_HIGH" -eq 1 ]; then
              FIX_OK=$(awk -v v="${FIXABLE_RATIO:-0}" 'BEGIN{print (v>=0.20)?1:0}')
              HR_OK=$(awk -v v="${HIGH_RISK_RATIO:-0}" 'BEGIN{print (v>=0.30)?1:0}')
  
              if [ "$FIX_OK" -eq 1 ] || [ "$HR_OK" -eq 1 ]; then
                echo "❌ BLOCK: AI=HIGH and fixable_ratio>=0.20 OR high_risk_ratio>=0.30"
                exit 1
              fi
  
              echo "✅ PASS: AI=HIGH but thresholds not exceeded."
            else
              echo "✅ PASS: AI not HIGH."
            fi
  
      - name: Upload scan & AI results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-and-ai-result
          path: |
            scan.json
            result.txt
