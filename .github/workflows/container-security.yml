name: AI Container Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Pull Docker image
        run: |
          docker pull nginx:latest

      - name: Scan image with Trivy
        run: |
          trivy image --format json -o scan.json nginx:latest

           - name: Summarize Trivy scan (counts + fixable)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' scan.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' scan.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' scan.json)
          FIXABLE=$(jq '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")] | length' scan.json)

          if [ "$TOTAL" -gt 0 ]; then
            export TOTAL FIXABLE CRITICAL HIGH
            FIXABLE_RATIO=$(python3 - <<'PY'
            import os
            t=int(os.environ["TOTAL"])
            f=int(os.environ["FIXABLE"])
            print(round(f/t, 3))
            PY
                        )
                        HIGH_RISK_RATIO=$(python3 - <<'PY'
            import os
            t=int(os.environ["TOTAL"])
            c=int(os.environ["CRITICAL"])
            h=int(os.environ["HIGH"])
            print(round((c+h)/t, 3))
            PY
                        )
                    else
                        FIXABLE_RATIO=0
                        HIGH_RISK_RATIO=0
                    fi

                    echo "TOTAL=$TOTAL" >> "$GITHUB_ENV"
                    echo "CRITICAL=$CRITICAL" >> "$GITHUB_ENV"
                    echo "HIGH=$HIGH" >> "$GITHUB_ENV"
                    echo "FIXABLE=$FIXABLE" >> "$GITHUB_ENV"
                    echo "FIXABLE_RATIO=$FIXABLE_RATIO" >> "$GITHUB_ENV"
                    echo "HIGH_RISK_RATIO=$HIGH_RISK_RATIO" >> "$GITHUB_ENV"

                    echo "=== Scan Summary ==="
                    echo "TOTAL=$TOTAL"
                    echo "CRITICAL=$CRITICAL"
                    echo "HIGH=$HIGH"
                    echo "FIXABLE=$FIXABLE"
                    echo "FIXABLE_RATIO=$FIXABLE_RATIO"
                    echo "HIGH_RISK_RATIO=$HIGH_RISK_RATIO"

                - name: Run AI risk prediction
                    run: |
                    python src/predict_risk.py scan.json | tee result.txt

                - name: Enforce security policy (AI + fixability + severity)
                    run: |
                    echo "=== Policy Inputs ==="
                    cat result.txt
                    echo ""
                    echo "TOTAL=$TOTAL CRITICAL=$CRITICAL HIGH=$HIGH FIXABLE=$FIXABLE FIXABLE_RATIO=$FIXABLE_RATIO HIGH_RISK_RATIO=$HIGH_RISK_RATIO"

                    AI_LABEL="UNKNOWN"
                    if grep -q "Predicted Risk Level: HIGH" result.txt; then
                        AI_LABEL="HIGH"
                    elif grep -q "Predicted Risk Level: MEDIUM" result.txt; then
                        AI_LABEL="MEDIUM"
                    elif grep -q "Predicted Risk Level: LOW" result.txt; then
                        AI_LABEL="LOW"
                    fi
                    echo "AI_LABEL=$AI_LABEL"

                    # Fail if CRITICAL exists AND at least one fix exists
                    if [ "${CRITICAL:-0}" -ge 1 ] && [ "${FIXABLE:-0}" -ge 1 ]; then
                        echo "❌ BLOCK: CRITICAL vulnerabilities exist and at least one is fixable."
                        exit 1
                    fi

                    # Fail if AI=HIGH AND (fixable_ratio>=0.20 OR high_risk_ratio>=0.30)
                    if [ "$AI_LABEL" = "HIGH" ]; then
                        export FIXABLE_RATIO HIGH_RISK_RATIO
                        python3 - <<'PY'
            import os, sys
            fix=float(os.environ.get("FIXABLE_RATIO","0"))
            highrisk=float(os.environ.get("HIGH_RISK_RATIO","0"))
            if fix >= 0.20 or highrisk >= 0.30:
                print("❌ BLOCK: AI=HIGH and fixable_ratio>=0.20 OR high_risk_ratio>=0.30")
                sys.exit(1)
            print("✅ PASS: AI=HIGH but thresholds not exceeded.")
            PY
                    else
                        echo "✅ PASS: AI not HIGH."
                    fi

                    if [ "$AI_LABEL" = "MEDIUM" ]; then
                        echo "⚠️ WARNING: AI predicted MEDIUM risk. Pipeline allowed, but review recommended."
                    fi

                - name: Upload scan & AI results
                    uses: actions/upload-artifact@v4
                    with:
          name: trivy-scan-and-ai-result
          path: |
            scan.json
            result.txt
